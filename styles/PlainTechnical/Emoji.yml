tests:
- name: flags an emoji
  input: |
    ✅ The build passes. 🚀 Deploy it.
  want: |
    1:1:PlainTechnical.Emoji:Emoji: '✅'. Delete it, or write the word.
    1:21:PlainTechnical.Emoji:Emoji: '🚀'. Delete it, or write the word.
- name: leaves a sign and an arrow alone
  input: |
    The text is © 2026. Press Enter → Tab.
  want: ''
- name: flags an emoji and a shortcode in a commit
  input: |
    repo: drop the cache 😀
    
    Drop it 👍 :bug: now. Thanks :+1:
  want: |
    1:22:PlainTechnical.Emoji:Emoji: '😀'. Delete it, or write the word.
    3:9:PlainTechnical.Emoji:Emoji: '👍'. Delete it, or write the word.
    3:11:PlainTechnical.Emoji:Emoji: ':bug:'. Delete it, or write the word.
    3:29:PlainTechnical.Emoji:Emoji: ':+1:'. Delete it, or write the word.
  format: COMMIT_EDITMSG
  view: Commit
- name: flags a sequence once
  input: |
    It ships 👍🏽 and 🇺🇸 and 👩‍💻 and 1️⃣ today.
  want: |
    1:10:PlainTechnical.Emoji:Emoji: '👍🏽'. Delete it, or write the word.
    1:17:PlainTechnical.Emoji:Emoji: '🇺🇸'. Delete it, or write the word.
    1:24:PlainTechnical.Emoji:Emoji: '👩‍💻'. Delete it, or write the word.
    1:32:PlainTechnical.Emoji:Emoji: '1️⃣'. Delete it, or write the word.
- name: leaves a role of Sphinx or MyST alone
  input: |
    See :ref:`the guide` and :class:`Foo`. The time is 10:30:45.
  want: ''
