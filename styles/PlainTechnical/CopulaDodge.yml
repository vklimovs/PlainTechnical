# Source: vale-ai-tells v1.37.0 ai-tells.ServesAsDodge (MIT).
# Changed: Leaves 'marks a pivotal', 'marks a significant' and 'marks a
# crucial' to InflatedWord and OverusedWord. Drops 'marks a key', since a
# script marks a key as used. Leaves a label before a colon to LabelAndExplain,
