# Source: vale-ai-tells v1.37.0 ai-tells-commits.CommitAttribution (MIT).
# Changed: Reads the body and the trailers of a commit. Matches the whole
# Co-Authored-By line of a Claude model, and an Assisted-by, Generated-by or
# Written-by trailer that names a tool. Leaves a person named Claude alone,
# unless a model name or a colon follows the name. Matches 'Generated by
# Cursor' in that case alone, and scopes the case of each other form to that
# form.
extends: existence
message: 'Tool attribution: ''%s''. Delete it.'
level: error
scope:
- body
- trailer
raw:
- '(?:'
- '(?i:Generated with \[Claude Code\])'
- '|(?i:Generated with Claude Code)'
- '|(?i:Co-Authored-By:\s*Claude(?: (?:Code|Opus|Sonnet|Haiku|Fable|\d)|[^\n]*anthropic\.com)[^\n]*)'
- '|(?i:(?:Assisted|Generated|Written)-by:\s*(?:Claude(?=:| (?:Code|Opus|Sonnet|Haiku|Fable|\d))|ChatGPT|GPT|Copilot|Cursor|Gemini|Codex)[^\n]*)'
- '|noreply@anthropic\.com'
- '|(?i:Co-Authored-By:\s*GitHub Copilot)'
- '|(?i:Co-Authored-By:\s*Cursor\b)'
- '|(?i:Generated with GitHub Copilot)'
- '|Generated by Cursor'
- )
tests:
- name: flags an Assisted-by trailer
  input: |
    fix(parser): handle empty input

    An empty file returned a nil tree.

    Assisted-by: Claude:claude-opus-4 mise
  want: |
    5:1:PlainTechnical.CommitAttribution:Tool attribution: 'Assisted-by: Claude:claude-opus-4 mise'. Delete it.
  format: COMMIT_EDITMSG
  view: Commit
- name: leaves a person in a trailer alone
  input: |
    fix(parser): handle empty input

    An empty file returned a nil tree.

    Co-authored-by: Jane Doe <jane@example.com>
    Signed-off-by: Jane Doe <jane@example.com>
  want: ''
  format: COMMIT_EDITMSG
  view: Commit
- name: flags a Generated with line
  input: |
    parser: add a check for empty input
    
    The check stops the parse.
    
    🤖 Generated with [Claude Code](https://claude.com/claude-code)
  want: |
    5:3:PlainTechnical.CommitAttribution:Tool attribution: 'Generated with Claude Code'. Delete it.
  format: COMMIT_EDITMSG
  view: Commit
- name: leaves a person named Claude alone
  input: |
    role: add it

    Body text here is plain.

    Co-Authored-By: Claude Dupont <claude.dupont@example.org>
  want: ''
  format: COMMIT_EDITMSG
  view: Commit
