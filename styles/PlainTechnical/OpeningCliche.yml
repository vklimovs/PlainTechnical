tests:
- name: flags 'You might be wondering'
  input: |
    You might be wondering why this matters.
  want: |
    1:1:PlainTechnical.OpeningCliche:Opening cliche: 'You might be wondering'. Start with the point.
- name: flags the full form
  input: |
    If you have ever wondered why the build fails, read on.
  want: |
    1:1:PlainTechnical.OpeningCliche:Opening cliche: 'If you have ever'. Start with the point.
- name: whether as a conditional
  input: |
    The loader checks whether the cache is warm.
  want: ''
