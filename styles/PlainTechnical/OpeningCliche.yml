# Source: vale-ai-tells v1.37.0 ai-tells.OpeningCliches (MIT).
# Changed: Leaves 'When it comes to' to InflatedWord. Matches the full form
# alone, since Contraction flags a contraction. Matches each token at the start
# of a sentence alone, since 'added in recent years' and 'whether you are a
# member' are plain in the middle of one. Adds 'This guide will show you how'
# and the like, from the wikiHow part of the M4 corpus.
extends: existence
message: 'Opening cliche: ''%s''. Start with the point.'
level: warning
ignorecase: true
tokens:
- '(?:\A|(?<=[.!?]\s))This (?:guide|article|post|tutorial) will (?:show you how|guide you through|take you through|teach you)'
- '(?:\A|(?<=[.!?]\s))In today''s rapidly evolving'
- '(?:\A|(?<=[.!?]\s))In today''s fast-paced'
- '(?:\A|(?<=[.!?]\s))In today''s digital age'
- '(?:\A|(?<=[.!?]\s))In today''s ever-changing'
- '(?:\A|(?<=[.!?]\s))In today''s interconnected'
- '(?:\A|(?<=[.!?]\s))In the realm of'
- '(?:\A|(?<=[.!?]\s))In the world of'
- '(?:\A|(?<=[.!?]\s))In the landscape of'
- '(?:\A|(?<=[.!?]\s))In the ever-evolving landscape'
- '(?:\A|(?<=[.!?]\s))In an era where'
- '(?:\A|(?<=[.!?]\s))In an age where'
- '(?:\A|(?<=[.!?]\s))In this day and age'
- '(?:\A|(?<=[.!?]\s))Embarking on a journey'
- '(?:\A|(?<=[.!?]\s))Embark on a journey'
- '(?:\A|(?<=[.!?]\s))Embarking on this journey'
