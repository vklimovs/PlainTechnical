# Source: vale-ai-tells v1.37.0 ai-tells-commits.CommitOverexplanation (MIT).
# Changed: Reads the body of a commit. Drops 'this is needed to' and the like,
# since deletion turns the reason into an order.
extends: existence
message: 'Filler: ''%s''. Delete it. The message keeps its meaning.'
level: warning
ignorecase: true
tokens:
- as part of this change
- as part of this commit
- as part of this update
- as part of this PR
- as part of this pull request
- as part of this refactor
- as part of this effort
- as part of this migration
- as part of this work
- this is necessary because
- this was necessary because
- this is needed because
- this was needed because
- this is required because
- this is necessary to ensure
- this was necessary to ensure
- along with necessary
- along with corresponding
- along with related
- along with relevant
- along with associated
- along with appropriate
- along with updated
- the following changes were made
- the following changes have been made
- the following modifications were made
- changes include
- changes made include
- the key changes are
- the main changes are
- the notable changes are
- summary of changes
- the goal of this change
- the purpose of this change
- the purpose of this commit
- the goal of this commit
- the intent of this change
- the motivation for this change
- the reason for this change
- the rationale behind this
scope: body
tests:
- name: flags 'as part of this change'
  input: |
    Fix the parser

    as part of this change the parser now.
  want: |
    3:1:PlainTechnical.CommitOverexplanation:Filler: 'as part of this change'. Delete it. The message keeps its meaning.
  format: COMMIT_EDITMSG
  view: Commit
- name: plain cause and effect
  input: |
    fix(parser): handle empty input

    An empty file returned a nil tree, which the caller dereferenced.
    The parser now returns an error before building the tree.
  want: ''
  format: COMMIT_EDITMSG
  view: Commit
