# Source: vale-ai-tells v1.37.0 ai-tells.AICompoundPhrases (MIT).
# Changed: Leaves 'stands as a testament' to ImportancePuffery, 'cutting-edge'
# to InflatedWord. Drops 'real value' and 'a real test', which are plain in
# systems prose. Matches 'plays a key role' and 'sets the stage for' alone, and
# drops 'before … hardens', since a signing key role, a CI stage and a hardened
# host are plain. Adds 'make informed decisions', from the HC3 corpus. Adds
# 'provides insights into', 'opens new avenues', 'contributes to the ongoing'
# and 'a better understanding of' from the arXiv part of the M4 corpus, and 'a
# daunting task', 'step-by-step guide' and 'a great way to' from its wikiHow
# part.
extends: existence
message: 'Stock phrase: ''%s''. Write the concrete fact.'
level: warning
ignorecase: true
tokens:
- '\b(?:provides?|provided|offers?|offered|gives?|gave|yields?|yielded)(?: (?:new|valuable|important|key|deep|deeper|useful|crucial|novel|significant|unique|fresh|further))? insights? (?:into|on)\b'
- '\b(?:opens?|opened)(?: up)? (?:new|novel|exciting|promising) avenues\b'
- '\bcontributes? to the ongoing\b'
- '\bto a (?:better|deeper|fuller|more complete) understanding of\b'
- '\ba daunting (?:task|process|prospect|undertaking)\b'
- '\bstep-by-step guide\b'
- '\ba (?:great|fantastic|excellent|wonderful) way to\b'
- '(?:make|makes|making) (?:more )?informed decisions'
