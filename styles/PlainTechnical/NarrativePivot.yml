# Source: vale-ai-tells v1.37.0 ai-tells.NarrativePivots (MIT).
# Changed: Matches the full form alone, since Contraction flags a contraction.
# Leaves 'changed the landscape' and 'shifted the paradigm' to InflatedWord,
# and 'moved the goalposts' to Idiom. Matches 'Something changed' as a sentence
# alone, since 'when something changed' is plain. Matches 'something shifted'
# and 'everything changed' as a whole sentence, and 'changes the game' at its
# end or before 'for everyone' or 'for good'. Drops 'rewrites the rules' and
# 'rewrites the playbook', since a daemon rewrites firewall rules and a
# generator rewrites an Ansible playbook.
extends: existence
message: 'Narrative pivot: ''%s''. State the point.'
level: warning
ignorecase: true
tokens:
- '(?:\A|(?<=[.!?]\s))Something shifted(?=[.!])'
- '(?:\A|(?<=[.!?]\s))Something changed(?=[.!])'
- '(?:\A|(?<=[.!?]\s))Something clicked(?=[.!])'
- '(?:\A|(?<=[.!?]\s))Something snapped(?=[.!])'
- '(?:\A|(?<=[.!?]\s))Everything changed(?=[.!])'
- '(?:\A|(?<=[.!?]\s))Everything shifted(?=[.!])'
- '(?:\A|(?<=[.!?]\s))Everything clicked(?=[.!])'
- and then it clicked
- and then it hit me
- that changed everything
- that changes everything
- this changes everything
- this changed everything
- and that made all the difference
- and that makes all the difference
- but then something interesting happened
- but then something unexpected happened
- but then I realized
- 'and that is when it hit me'
- 'and that is when I realized'
- it was a turning point
- it was an inflection point
- it was a wake-up call
- a light bulb went off
- a lightbulb went off
- the penny dropped
- it all came together
- it all made sense
- things started to click
- things fell into place
- 'changed the game(?= for (?:everyone|good|\w+ teams?)\b|[.!])'
- 'changes the game(?= for (?:everyone|good|\w+ teams?)\b|[.!])'
- 'changing the game(?= for (?:everyone|good|\w+ teams?)\b|[.!])'
- 'change the game(?= for (?:everyone|good|\w+ teams?)\b|[.!])'
- changed everything forever
- 'flipped the script(?=[.,;:!?]|$| (?:for|of|on)\b)'
- 'flips the script(?=[.,;:!?]|$| (?:for|of|on)\b)'
- 'flipping the script(?=[.,;:!?]|$| (?:for|of|on)\b)'
tests:
- name: flags 'Something shifted'
  input: |
    The launch went out. Something shifted.
  want: |
    1:22:PlainTechnical.NarrativePivot:Narrative pivot: 'Something shifted'. State the point.
- name: concrete change
  input: |
    The patch changed the cache layout and the lock order.
  want: ''
- name: leaves a transitive 'shifted' alone
  input: |
    Something shifted the offset by one.
  want: ''
