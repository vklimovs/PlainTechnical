# Source: ASD-STE100 Issue 9 rule 5.4, via SimpleEnglish a6fcb4fde098 (MIT).
# A sentence that opens on one of these verbs, alone or after a condition
# and a comma, is an instruction. The verb takes an object, a particle or a
# stop after it. A description that opens on a noun such as 'Set' then
# stays out. ProceduralLength and TrailingCondition hold the same list.
extends: existence
message: "Condition after the command: '%s'. Put the condition first, as in 'If the build fails, read the log'."
level: warning
scope: sentence
nonword: true
tokens:
  - '\A(?:(?:If|When|Before|After|Until|While|Unless)\b[^,.]{1,160},\s+(?i:Add|Allow|Apply|Assign|Attach|Build|Call|Change|Check|Choose|Clean|Clear|Click|Clone|Close|Commit|Compile|Configure|Connect|Copy|Create|Define|Delete|Deploy|Disable|Do|Download|Edit|Enable|Enter|Erase|Examine|Export|Extract|Fetch|Find|Follow|Generate|Get|Give|Go|Grant|Import|Increase|Decrease|Insert|Install|Keep|Kill|Launch|Let|Load|Make|Mark|Measure|Merge|Migrate|Modify|Mount|Move|Open|Pass|Paste|Pick|Point|Press|Print|Pull|Push|Put|Read|Rebase|Reboot|Rebuild|Refresh|Register|Reload|Remove|Rename|Repeat|Replace|Reset|Restart|Restore|Retry|Revert|Rotate|Run|Save|Select|Send|Set|Sign|Specify|Start|Stop|Submit|Switch|Sync|Tag|Test|Turn|Type|Uninstall|Unlock|Unmount|Update|Upgrade|Upload|Use|Validate|Verify|Wait|Write)|(?:Add|Allow|Apply|Assign|Attach|Build|Call|Change|Check|Choose|Clean|Clear|Click|Clone|Close|Commit|Compile|Configure|Connect|Copy|Create|Define|Delete|Deploy|Disable|Do|Download|Edit|Enable|Enter|Erase|Examine|Export|Extract|Fetch|Find|Follow|Generate|Get|Give|Go|Grant|Import|Increase|Decrease|Insert|Install|Keep|Kill|Launch|Let|Load|Make|Mark|Measure|Merge|Migrate|Modify|Mount|Move|Open|Pass|Paste|Pick|Point|Press|Print|Pull|Push|Put|Read|Rebase|Reboot|Rebuild|Refresh|Register|Reload|Remove|Rename|Repeat|Replace|Reset|Restart|Restore|Retry|Revert|Rotate|Run|Save|Select|Send|Set|Sign|Specify|Start|Stop|Submit|Switch|Sync|Tag|Test|Turn|Type|Uninstall|Unlock|Unmount|Update|Upgrade|Upload|Use|Validate|Verify|Wait|Write))(?=\s+(?:the|a|an|this|that|these|those|each|every|all|your|its|their|it|them|to|on|in|into|from|with|for|up|down|out|off|over|back|at|not|sure|no|one|two|three)\b|\s+[*\"“\d]|(?<=\b(?:Click|Press|Select|Choose|Type|Enter|Open))\s+[A-Z]|[.,:])[^.:]*?\s(?:if|when|unless)\s'
tests:
- name: flags a trailing condition
  input: |
    - Read the log if the build fails.
  want: |
    1:3:PlainTechnical.TrailingCondition:Condition after the command: 'Read the log if '. Put the condition first, as in 'If the build fails, read the log'.
- name: leaves a leading condition alone
  input: |
    - If the build fails, read the log.
  want: ''
- name: flags a trailing condition in prose
  input: |
    Read the log if the build fails.
  want: |
    1:1:PlainTechnical.TrailingCondition:Condition after the command: 'Read the log if '. Put the condition first, as in 'If the build fails, read the log'.
- name: leaves a description with when alone
  input: |
    The cache drops an entry when memory runs low. The service restarts if the probe fails.
  want: ''
