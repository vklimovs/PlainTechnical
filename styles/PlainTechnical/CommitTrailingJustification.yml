# Source: vale-ai-tells v1.37.0 ai-tells-commits.CommitTrailingJustification (MIT).
# Changed: Reads the body of a commit. Leaves 'providing a more robust' to
# UnmeasuredClaim, and a tail after a comma to ParticipleTail. Leaves 'by
# ensuring that the lock is held' alone, which names the change. Drops the
# clauses such as 'which ensures that' and 'which allows the', which give the
# reason of a change.
extends: existence
message: 'Trailing justification: ''%s''. Delete it. The diff shows the result.'
level: warning
ignorecase: true
