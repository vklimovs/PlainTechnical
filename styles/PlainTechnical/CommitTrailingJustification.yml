tests:
- name: flags 'ensuring correctness'
  input: |
    parser: add a check for empty input
    
    The change adds a check for empty files ensuring correctness.
  want: |
    3:41:PlainTechnical.CommitTrailingJustification:Trailing justification: 'ensuring correctness'. Delete it. The diff shows the result.
  format: COMMIT_EDITMSG
