# Source: vale-ai-tells v1.37.0 ai-tells.HollowAcknowledgment (MIT).
# Changed: Matches a problem noun, such as 'gap', 'issue' or 'risk', as the
# object, and drops 'lists', 'flags', 'maps', 'catalogs' and 'enumerates',
# since 'the command lists the files without deleting them' is plain.
extends: existence
message: 'Hollow acknowledgment: ''%s''. Resolve the point or delete the clause.'
level: warning
nonword: true
ignorecase: true
tokens:
- '\b(?:names?|identifies|identified|describes?|described|raises?|raised|poses?|posed|surfaces?|surfaced|diagnoses|diagnosed|notes?|noted|acknowledges?|acknowledged|highlights?|highlighted|gestures? at|points? out) (?:the|a|an|its|this|that|these|those|their) (?:\w+ )?(?:problem|issue|gap|tension|risk|question|concern|flaw|trade-?off|limitation|challenge|weakness|contradiction|paradox|danger|hazard)s? without (?:ever |actually |really |truly |once )?\w+ing (?:it|them|that|those|these|the \w+)\b'
- \ball (?:diagnosis|analysis|critique|description|observation|theory|talk|questions?|naming|labeling|labelling) and no (?:treatment|action|solutions?|answers?|prescription|remedy|remedies|fixes?|follow-through)\b
- \ball (?:diagnosis|analysis|critique|description|observation|theory|talk|questions?|naming|labeling|labelling), no (?:treatment|action|solutions?|answers?|prescription|remedy|remedies|fixes?|follow-through)\b
tests:
- name: flags 'names the gap without filling it'
  input: |
    It names the gap without filling it.
  want: |
    1:4:PlainTechnical.HollowAcknowledgment:Hollow acknowledgment: 'names the gap without filling it'. Resolve the point or delete the clause.
- name: without a back-reference
  input: |
    The maintainer left the call without saying goodbye.
  want: ''
