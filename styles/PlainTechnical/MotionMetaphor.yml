- \bbak(?:es?|ed|ing) (?:in|into)\b(?! (?:the oven|a pan|an oven)\b)
- \bbak(?:es?|ed|ing) (?:the|a|an|its|this|that|every|each) (?:[a-z]+ )?[a-z]+ (?:in|into)\b
- '\b(?:a|an|the|this|that|these|those|each|every|its|their|both|all|one|any|some|no) (?:[a-z''-]+ )?[a-z]+ (?:then |also |never |still |only |always )?(?:drives?|drove|driven|shape|shaped) (?:the|a|an|its|their|this|that|these|those|each|every|both|all|what|which|how|whether)\b'
