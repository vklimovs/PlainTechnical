# Source: vale-ai-tells v1.37.0 ai-tells.MotionMetaphors (MIT).
# Changed: Leaves 'shapes' to FigurativeShape.
extends: existence
message: 'Motion metaphor: ''%s''. Use the literal operation, such as ''is passed to'' or ''depends on''.'
level: warning
nonword: true
ignorecase: true
exceptions:
- (?i)people
- (?i)person
- (?i)m[ae]n
- (?i)wom[ae]n
- (?i)child(?:ren)?
- (?i)kids?
- (?i)bab(?:y|ies)
- (?i)parents?
- (?i)mothers?
- (?i)fathers?
- (?i)birds?
- (?i)cats?
- (?i)dogs?
- (?i)animals?
- (?i)ladders?
- (?i)walls?
