# Source: vale-ai-tells v1.37.0 ai-tells-commits.CommitUnquantifiedClaims (MIT).
# Changed: Reads the subject and the body of a commit. Leaves 'blazing fast' to
# UnmeasuredClaim, and an adverb such as 'significantly' before a comparison or
# a change to IncompleteComparison.
extends: existence
message: 'Unquantified claim: ''%s''. Give the numbers and the baseline.'
level: warning
raw:
- '(?i)(?:'
- '\bmuch\s+(?:faster|slower|better|smaller|larger|cleaner)\b'
- '|\b(?:huge|massive|major)\s+(?:performance|speed|memory|latency)\s+(?:improvement|boost|gain|reduction|increase|win)\b'
- '|\bnoticeably\s+(?:faster|slower|better)\b'
- )
scope:
- subject
- body
tests:
- name: flags 'much faster'
  input: |
    repo: add the parser
    
    The parser is much faster now.
  want: |
    3:15:PlainTechnical.CommitUnquantifiedClaim:Unquantified claim: 'much faster'. Give the numbers and the baseline.
  format: COMMIT_EDITMSG
  view: Commit
- name: claim backed by a measurement
  input: |
    perf(parser): cache tokens

    Lexing a 10 MB file drops from 480 ms to 310 ms.
  want: ''
  format: COMMIT_EDITMSG
  view: Commit
