tests:
- name: flags 'crowns the'
  input: |
    That commit crowns the release.
  want: |
    1:13:PlainTechnical.Cliche:Cliche: 'crowns the'. Say what you mean in plain words.
- name: flags the idiom
  input: |
    The old parser holds its own.
  want: |
    1:16:PlainTechnical.Cliche:Cliche: 'holds its own'. Say what you mean in plain words.
- name: leaves a literal hold alone
  input: |
    A dataset holds its own mapping, and a record holds its own `host.name`.
  want: ''
- name: leaves 'On the other hand' to FormalTransition
  input: |
    On the other hand the tree is newer.
  want: ''
