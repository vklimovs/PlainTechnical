# Source: vale-ai-tells v1.37.0 ai-tells.AnthropomorphicJustification (MIT).
# Changed: Reads 'holds its own' as the idiom only where no noun or code
# follows it. Leaves 'load-bearing' to InflatedWord, and 'claims the lead' and
# 'hangs on one runner' alone. Drops the phrases that are plain in systems
# prose: 'stands alone', 'stands on its own', 'stands by itself', 'configures
# itself', 'reports itself', 'resolves itself', 'versions itself', 'does the
# work', 'does the actual work', 'does the real work', 'does no harm' and
# 'hands the task to'.
extends: existence
message: 'Cliche: ''%s''. Say what you mean in plain words.'
level: warning
ignorecase: true
