tests:
- name: flags 'Experts argue'
  input: |
    Experts argue that caching is essential for read-heavy workloads.
  want: |
    1:1:PlainTechnical.VagueAttribution:Vague attribution: 'Experts argue'. Name the source or delete the claim.
- name: flags the tokens of Voices.Weasel
  input: |
    Studies show that caching helps. Many argue for it.
  want: |
    1:1:PlainTechnical.VagueAttribution:Vague attribution: 'Studies show'. Name the source or delete the claim.
    1:34:PlainTechnical.VagueAttribution:Vague attribution: 'Many argue'. Name the source or delete the claim.
- name: named source
  input: |
    The Go team argues for small interfaces in the 2015 proverbs talk.
  want: ''
