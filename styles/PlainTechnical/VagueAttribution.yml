- industry reports show
- industry experts
- industry observers
- industry analysts
- observers have cited
- observers have noted
- observers note
- critics argue
- critics suggest
- critics contend
- critics have noted
- critics have argued
- some analysts
- some observers
- some researchers
- many experts
- many analysts
- many observers
- many researchers
- studies show
- many argue
- widely regarded as
- studies suggest that
- studies indicate that
- studies have shown that
- studies have found that
- research shows that
- research suggests that
