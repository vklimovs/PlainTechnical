# Source: vale-ai-tells v1.37.0 ai-tells.VagueAttributions (MIT).
# Changed: Holds the three tokens of Voices.Weasel. Drops 'the data suggests'
# and 'the evidence suggests', which point at data in the text.
extends: existence
message: 'Vague attribution: ''%s''. Name the source or delete the claim.'
level: warning
ignorecase: true
