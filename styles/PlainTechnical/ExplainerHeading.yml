# Source: vale-ai-tells v1.37.0 ai-tells.ExplainerHeadings (MIT).
# Changed: Leaves 'Deep Dive' to OverusedWord and 'Under the Hood' to
# InflatedWord.
extends: existence
message: 'Explainer heading: ''%s''. Name the topic.'
level: warning
ignorecase: true
scope: heading
tokens:
- (?:what|why|how|when|where|who) (?:the|this|that|these|those|a|an|each|every|your|our|its) [-'\w]+ [-'\w]+
- Demystifying
- Why It Matters
- Why This Matters
- Why It Exists
- Why This Exists
- What It Solves
- What This Solves
- What It Does
- What This Does
- A Closer Look
- The Inner Workings
tests:
- name: flags 'Demystifying'
  input: |
    ### Demystifying the Cache
  want: |
    1:5:PlainTechnical.ExplainerHeading:Explainer heading: 'Demystifying'. Name the topic.
- name: conventional how-to heading
  input: |
    # How to Configure the Cache
  want: ''
