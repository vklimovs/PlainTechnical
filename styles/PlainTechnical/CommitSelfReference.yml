# Source: vale-ai-tells v1.37.0 ai-tells-commits.CommitSelfReference (MIT).
# Changed: The messages do not use contractions, after ASD-STE100 rule 4.2.
# Adds a sentence that opens on 'I' and a past tense, as in 'I fixed the bug'.
extends: existence
message: 'Self-reference: ''%s''. State what you did and why.'
level: warning
ignorecase: true
tokens:
- This commit adds
- This commit fixes
- This commit updates
- This commit removes
- This commit introduces
- This commit implements
- This commit improves
- This commit resolves
- This commit addresses
- This commit refactors
- This commit cleans up
- This commit moves
- This commit renames
- This commit modifies
- This commit enhances
- This commit ensures
- This commit contains
- This change adds
- This change fixes
- This change updates
- This change removes
- This change introduces
- This change implements
- This change improves
- This change resolves
- This change addresses
- This change refactors
- This change ensures
- This change modifies
- This change enhances
- This PR adds
- This PR fixes
- This PR updates
- This PR removes
- This PR introduces
- This PR implements
- This PR improves
- This PR resolves
- This PR addresses
- This PR refactors
- This PR contains
- This update adds
- This update fixes
- This update improves
- This update introduces
- This update implements
- This update resolves
- This update ensures
- These changes add
- These changes fix
- These changes update
- These changes remove
- These changes introduce
- These changes implement
- These changes improve
- These changes resolve
- These changes address
- These changes ensure
- This patch fixes
- This patch adds
- This patch updates
- This patch resolves
- This patch addresses
- This patch improves
- In this commit
- In this PR
- In this change
- In this update
- In this patch
- In this pull request
- '(?:\A|(?<=[.!?]\s))I (?:\w+ )?(?:\w+ed|made|wrote|ran|built|took|found)\b'
scope:
- subject
- body
tests:
- name: flags 'This commit implements'
  input: "This commit implements comprehensive validation for the new auth flow,\nensuring proper handling of edge cases and improving overall security.\n\n\U0001F916 Generated with [Claude Code](https://claude.com/claude-code)\n"
  want: |
    1:1:PlainTechnical.CommitSelfReference:Self-reference: 'This commit implements'. State what you did and why.
  format: COMMIT_EDITMSG
  view: Commit
- name: commit reference without a narrating verb
  input: |
    revert: undo the lexer split

    Reverts the earlier commit that split the lexer, which broke the build.
  want: ''
  format: COMMIT_EDITMSG
  view: Commit
