# Source: vale-ai-tells v1.37.0 ai-tells.FillerPhrases (MIT).
# Changed: Leaves 'due to the fact that' and 'in order to' to InflatedWord,
# and 'I will be honest' to ThroatClearing. Leaves 'to be honest', 'to be
# frank' and 'the truth is' to AffirmativeFormula, and 'is able to' to
# ModalVerb. Reads 'honestly', 'frankly' and 'truthfully' before a comma or a
# question mark only. Matches the full form alone, since Contraction flags a
# contraction. Adds 'first and foremost', 'as a matter of fact', 'for all
# intents and purposes', 'there are a number of' and 'in a timely manner'.
# Drops 'tends to', as in 'the error tends to zero'. Adds the 'different' of
# 'many different', from the HC3 corpus. Adds 'Without a doubt', and
# 'Absolutely', 'Certainly' and 'Of course' before a comma at the start of a
# sentence, which Sycophancy leaves to it.
extends: existence
message: 'Filler: ''%s''. Delete it, or use the short form, such as ''can'' or ''many''.'
level: warning
ignorecase: true
tokens:
- Without a doubt
- '(?:\A|(?<=[.!?]\s))(?:Absolutely|Certainly|Of course)(?=,)'
- '(?<=\b(?:many|several|various|numerous|multiple) )different\b'
- a wide range of
- a broad range of
- a variety of
- an abundance of
- a multitude of
- countless
- numerous
- innumerable
- for the purpose of
- with the aim of
- with a view to
- so as to
- serves to
- has the potential to
- is capable of
- owing to the fact that
- in light of the fact that
- given the fact that
- despite the fact that
- regardless of the fact that
- '(?<!due to )the fact that'
- it is clear that
- it is evident that
- it is apparent that
- it is obvious that
- it can be seen that
- it can be observed that
- and honestly
- 'honestly(?=[,?])'
- and frankly
- 'frankly(?=[,?])'
- and truthfully
- 'truthfully(?=[,?])'
- 'if i am being honest'
- 'if i am being frank'
- to tell you the truth
- in all honesty
- quite honestly
- quite frankly
- to be perfectly honest
- to be completely honest
- to be totally honest
- to be brutally honest
- to be 100% honest
- the honest truth
- honest answer
- honest take
- my honest opinion
- 'first and foremost'
- 'as a matter of fact'
- 'for all intents and purposes'
- 'there are a number of'
- 'in a timely manner'
tests:
- name: flags 'a wide range of'
  input: |
    The tool reads a wide range of formats.
  want: |
    1:16:PlainTechnical.FillerPhrase:Filler: 'a wide range of'. Delete it, or use the short form, such as 'can' or 'many'.
- name: flags 'Truthfully'
  input: |
    Truthfully, the build failed.
  want: |
    1:1:PlainTechnical.FillerPhrase:Filler: 'Truthfully'. Delete it, or use the short form, such as 'can' or 'many'.
- name: plain statement
  input: |
    The library supports three formats, and the parser reads each one.
  want: ''
