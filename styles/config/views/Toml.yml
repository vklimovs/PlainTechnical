# Reads a comment that opens on its marker, one to three spaces and text. Vale
# reads it as Markdown and skips a quotation in it. A marker with no space or a
# tab after it, or with four spaces or more, marks a line of code.
engine: tree-sitter
lang: toml
scopes:
  - name: comment
    expr: '((comment) @comment (#match? @comment "^# {1,3}\\S"))'
    type: md
