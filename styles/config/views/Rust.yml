# Reads a comment that opens on its marker, one to three spaces and text. Vale
# reads it as Markdown and skips a quotation in it. A marker with no space or a
# tab after it, or with four spaces or more, marks a line of code, and so does
# a comment that ends on a `;` or a brace.
engine: tree-sitter
lang: rust
scopes:
  - name: comment
    expr: '((line_comment) @comment (#match? @comment "^//[/!]? {1,3}\\S") (#not-match? @comment "(;|[{}])\\s*(\\*/)?$"))'
    type: md
  - name: comment
    expr: '((block_comment) @comment (#match? @comment "^/\\*[*!]?\\s") (#not-match? @comment "(;|[{}])\\s*(\\*/)?$"))'
    type: md
