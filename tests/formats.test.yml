- name: leaves the rules of prose off in a comment
  input: |
    #!/bin/sh
    # This is *really* the fix. This matters because it fails.
    # The fix? It works.
    # Result: the build fails.
    # - Restart the sync service on the host that runs the nightly import job after the backup of the primary database finishes cleanly.
    # Comprehensive internationalization considerations necessitate sophisticated infrastructure.
  want: |
    2:3:PlainTechnical.BareDemonstrative:Bare demonstrative: 'This is'. Name the thing, as in 'This setting is'.
    2:12:PlainTechnical.EmptyWord:Empty word: 'really'. Delete it. The sentence keeps its meaning.
    3:12:PlainTechnical.MicDrop:Mic-drop sentence: 'It works.'. Join the point to the sentence it concludes.
    6:3:PlainTechnical.UnmeasuredClaim:Unmeasured claim: 'Comprehensive'. Give the measurable property, such as 'retries three times'.
    6:65:PlainTechnical.OverusedWord:Overused word: 'sophisticated'. Use a specific, common word.
  format: sh
