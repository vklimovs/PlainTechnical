# Each case runs the whole style on a file of one format, through the View
# that the configuration of the package maps to it.
- name: reads a TypeScript comment and skips a quotation in it
  input: |
    // The "should" keyword is fine here.
    // You should restart it.
    const s = "a; should";
  want: |
    2:8:PlainTechnical.ModalVerb:Modal verb: 'should'. Write 'must' for a requirement and 'can' for a possibility, or state the fact.
  format: ts
- name: reads a Python comment and docstring and skips a quotation
  input: |
    # The "should" keyword is fine here.
    # You should restart it.
    def f():
        """The "should" word. It could fail."""
        x = "should; robust"
  want: |
    2:7:PlainTechnical.ModalVerb:Modal verb: 'should'. Write 'must' for a requirement and 'can' for a possibility, or state the fact.
    4:30:PlainTechnical.ModalVerb:Modal verb: 'could'. Write 'must' for a requirement and 'can' for a possibility, or state the fact.
  format: py
- name: skips TOML code that is commented out
