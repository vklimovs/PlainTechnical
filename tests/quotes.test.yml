  contains: PlainTechnical.UnclosedQuote
  format: log
- name: skips the attributes of a block of HTML
  input: |
    <p align="center">
      <img src="logo.png" alt="Project logo">
    </p>

    <h2 align="center">The "X" tool</h2>

    Press the (“) key twice.

    The ” character closes a string.

    Build with --backend=vs. A line that starts with ; is a comment.
    Set the type to text/html; charset=utf-8 for the page.
  absent: PlainTechnical.UnclosedQuote
- name: reads a closed quotation in a block of HTML as closed
  input: |
    <p>
    The value "closed" is set, and the "other" one too.
    </p>
  absent: PlainTechnical.UnclosedQuote
- name: pairs the quotes of an assignment in prose
  input: |
    Run sudo env PATH="$PATH" NON_ROOT_USERNAME=$USER make.

    - add "--loginstall <DIR>" and loginstall="<DIR>" options

    Set add_dracutmodules+=" <dracut modules> " in the file.
  absent: PlainTechnical.UnclosedQuote
- name: pairs a quotation after a literal quote mark
  input: |
    Skip the '"' form here. It prints "hello" there.

    Escape a quote (") in a value. The log says "done" then.

    The " character opens a string. The log says "done" then.

    The cookie is a=1; Path=/ there.
  absent: PlainTechnical.UnclosedQuote
- name: pairs a quotation after a shell variable
  input: |
    Copy $src to "$dst" on the host.

    Then copy ${x} and "${y}" too.
  absent: PlainTechnical.UnclosedQuote
