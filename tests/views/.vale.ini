# The StylesPath holds the package as a sync leaves it, so Vale loads the
# configuration of the package first. This file then maps an extension to each
# View that a case cannot choose by itself.
StylesPath = ../pkg
MinAlertLevel = suggestion

[formats]
tasks = yml
specs = yml

[*.{yaml,yml}]
View = Comments

[*.tasks]
View = AnsibleTasks

[*.specs]
View = ArgumentSpecs

[*.commit]
View = Commit

[*.xml]
BasedOnStyles = PlainTechnical
Transform = ../pkg/config/templates/text.xsl

# The package gives these settings to a file that ends in .yaml or .yml, and
# to COMMIT_EDITMSG. A case names its file after its format, so they repeat
# here.
[*.{tasks,specs,commit}]
PlainTechnical.ColonReveal = NO
PlainTechnical.Emphasis = NO
PlainTechnical.InstructionLength = NO
PlainTechnical.Metacommentary = NO
PlainTechnical.ParagraphLengthVariance = NO
PlainTechnical.ReadingEase = NO
PlainTechnical.RhetoricalQuestion = NO
PlainTechnical.SentenceLengthVariance = NO
PlainTechnical.SentenceStartRepetition = NO
