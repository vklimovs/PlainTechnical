# Vale reads this file from the package without its StylesPath, and before
# the configuration of the project.
StylesPath = styles
MinAlertLevel = warning
# A quotation keeps its source's form.
SkippedScopes = script, style, pre, figure, blockquote

[formats]
# A text file reads as Markdown. The configuration then skips its quotations.
txt = md
pyi = py
jsonc = js
hh = cpp
hxx = cpp

[*]
BasedOnStyles = PlainTechnical
# Vale applies the TokenIgnores of every matching section, in no fixed order.
# Patterns that can overlap must sit in one alternation. Every pattern sits
# here, in [*].
#
# A shell variable such as $dst is syntax, since Markdown reads the text from
# one $ to the next as math. Jinja tags are syntax, and so are the delimiters
# of a Jinja comment. A code span takes any quote inside it. Each span stops
# at a blank line, and UnclosedQuote flags a quote that never closes. A quote
# after a digit is an inch mark, and a quote mark that UnclosedQuote leaves as
# a literal opens nothing here either.
#
# A match inside a tag of a raw block of HTML breaks the tag, and a stray quote
# mark then reads as text. So a quotation never starts inside a tag.
TokenIgnores = ([$][A-Za-z_{(@*#?!0-9][\w}]*|[{]%[^%]*%[}]|[{][{][^}]*[}][}]|[{]#|#[}]|(?<!`)`(?>[^`\n]+|\n(?![ \t]*\n))+`(?!`)|(?<!\d)(?<!<[A-Za-z][^<>\n]*)(?!(?<=')"'|(?<=[(])"[)]|" (?:characters?|marks?|signs?)\b)"(?>[^"\n]+|\n(?![ \t]*\n))*"|“(?>[^”\n]+|\n(?![ \t]*\n))+”)

# Vale matches a section against the path it gets. A bare name then matches
# only a relative path at the root, and once a section holds a /, its * stops
# at a /. As a result, a section with a file name puts **/ before every
# name. **/ also matches the root.

# When two sections give one file a View, Vale picks one of them in no fixed
# order, also between a section of the package and one of a project. So the
# package maps the YAML of an Ansible role alone, by its path, and a project
# maps its other YAML.
[**/roles/*/{tasks,handlers}/*.{yaml,yml}]
View = AnsibleTasks

[**/meta/argument_specs.{yaml,yml}]
View = ArgumentSpecs

# Hash also reads an ebuild, an OpenRC script, PowerShell, an nftables ruleset
# and a configuration file that take # as a comment marker, also after a
# value. It reads a git hook by its name, and .ansible-lint, which holds YAML
# under a name that Vale does not read as YAML.
[**/{*.{sh,bash,zsh,ebuild,eclass,initd,confd,conf,env,nix,mk,ps1,psm1,psd1,nft},*.initd-r*,*.confd-r*,Makefile,GNUmakefile,makefile,CMakeLists.txt,requirements*.txt,robots.txt,.env,.envrc,.ansible-lint,.githooks/{applypatch-msg,pre-applypatch,post-applypatch,pre-commit,pre-merge-commit,prepare-commit-msg,commit-msg,post-commit,pre-rebase,post-checkout,post-merge,pre-push,pre-receive,update,proc-receive,post-receive,post-update,reference-transaction,push-to-checkout,pre-auto-gc,post-rewrite,sendemail-validate,fsmonitor-watchman,post-index-change}}]
View = Hash

# In a systemd unit, an INI file, a Dockerfile and the like, a # after a value
# is part of the value. WholeLine reads a comment that fills its line.
[**/{*.{ini,cfg,tmpfiles,sysctl,logrotate,dockerfile,service,socket,timer,mount,automount,swap,path,target,slice,network,netdev,link},Containerfile,Containerfile.*,Dockerfile,Dockerfile.*,.gitignore,.npmrc}]
View = WholeLine

# Tsx reads each piece of text around an expression apart, so a quotation
# around one reads as two unclosed marks.
[*.{tsx,jsx}]
View = Tsx
PlainTechnical.UnclosedQuote = NO

# A code language takes a View that reads its comments as Markdown. Vale then
# skips a quotation in a comment, as it does in a document.
[*.{py,pyi}]
View = Python

[*.{ts,mts,cts}]
View = TypeScript

[*.{js,mjs,cjs,jsonc}]
View = JavaScript

# A kafel policy takes the comments of C.
[*.{c,h,kafel}]
View = C

[*.{cc,cpp,cxx,hh,hpp,hxx}]
View = Cpp

[*.go]
View = Go

[*.rs]
View = Rust

[*.toml]
View = Toml

[*.j2]
View = Jinja

[**/COMMIT_EDITMSG]
View = Commit

# A patch quotes code, and a line of code can open on #.
[*.{diff,patch}{,.j2}]
BasedOnStyles =

# Data and archives are not prose. Vale reads a file with an unknown extension
# as text, an archive too.
[*.{csv,tsv,xz,gz,bz2,zst,lz4,zip,7z,tar,tgz}]
BasedOnStyles =

# XML takes no style here, since Vale needs a transform to read it. The
# package ships one in its templates. A project maps it by its absolute path,
# because Vale reads a relative path from the directory of the project file.
[*.xml]
BasedOnStyles =

# Vale reads each attribute of a page as text, apart from the text around it.
# So a quotation around a link reads as two unclosed marks.
[*.html]
PlainTechnical.UnclosedQuote = NO

# A license is legal text that a project quotes whole.
[**/{LICENSE,LICENSE.*,COPYING,COPYING.*,LICENSES/*}]
BasedOnStyles =

# In code, data and a commit message, a raw-scoped rule reads the whole file,
# code included. A comment there also uses labels such as FIXME:, emphasis
# and short lines as markup. So these rules stay off there.
[**/{*.{sh,bash,zsh,ps1,psm1,psd1,nft,kafel,j2,py,pyi,yaml,yml,toml,ts,tsx,js,jsx,mjs,cjs,mts,cts,jsonc,c,h,cc,cpp,cxx,hh,hpp,hxx,go,rs,ebuild,eclass,initd,confd,conf,ini,cfg,env,nix,mk,tmpfiles,sysctl,logrotate,dockerfile,service,socket,timer,mount,automount,swap,path,target,slice,network,netdev,link},*.initd-r*,*.confd-r*,Makefile,GNUmakefile,makefile,Containerfile,Containerfile.*,Dockerfile,Dockerfile.*,.gitignore,.env,.envrc,.npmrc,CMakeLists.txt,requirements*.txt,robots.txt,.ansible-lint,.githooks/{applypatch-msg,pre-applypatch,post-applypatch,pre-commit,pre-merge-commit,prepare-commit-msg,commit-msg,post-commit,pre-rebase,post-checkout,post-merge,pre-push,pre-receive,update,proc-receive,post-receive,post-update,reference-transaction,push-to-checkout,pre-auto-gc,post-rewrite,sendemail-validate,fsmonitor-watchman,post-index-change},COMMIT_EDITMSG}]
PlainTechnical.ColonReveal = NO
PlainTechnical.Emphasis = NO
PlainTechnical.InstructionLength = NO
PlainTechnical.Metacommentary = NO
PlainTechnical.ParagraphLengthVariance = NO
PlainTechnical.ReadingEase = NO
PlainTechnical.RhetoricalQuestion = NO
PlainTechnical.SentenceLengthVariance = NO
PlainTechnical.SentenceStartRepetition = NO

